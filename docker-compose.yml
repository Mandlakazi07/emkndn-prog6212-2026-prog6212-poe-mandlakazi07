# One command starts the web app:   docker compose up --build
# Then open http://localhost:8080
#
# The API is NOT in a container: it uses SQL Server Express on this computer with Windows login,
# which a Linux container cannot use. The web app (in the container) calls the API on the host computer.
# Start the API first:  dotnet run --project RaceDay.Api --urls "http://0.0.0.0:5159"

services:
  web:
    build:
      context: ./RaceDay.Web
    image: raceday-web
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # "host.docker.internal" means "the computer Docker is running on"
      - Api__BaseUrl=http://host.docker.internal:5159/
    extra_hosts:
      - "host.docker.internal:host-gateway"
