name: Build and Test

# Runs on every push to any branch, on pull requests, and on demand from the Actions tab
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay.slnx

      - name: Build the whole solution (API, tests and MVC web app)
        run: dotnet build RaceDay.slnx --configuration Release --no-restore

      - name: Build the MVC web project
        run: dotnet build RaceDay.Web/RaceDay.Web.csproj --configuration Release --no-restore

      - name: Run all unit tests
        run: dotnet test RaceDay.slnx --configuration Release --no-build --verbosity normal

      - name: Build the Docker image for the web app
        run: docker build -t raceday-web ./RaceDay.Web
