name: .NET CI

on:
  push:
    branches: [ "part3" ]
  pull_request:
    branches: [ "part3" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore RaceDay.slnx
    - name: Build
      run: dotnet build RaceDay.slnx --no-restore
    - name: Test
      run: dotnet test RaceDay.slnx --no-build --verbosity normal
